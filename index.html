<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>3D STUB SOLVER</h1>
    <div>R: </div>
    <input type="number" id="R" placeholder="ENTER R VALUE" step="0.01">
    <div>X:</div>
    <input type="number" id="X" placeholder="ENTER X VALUE" step="0.01">
    <button id="submit">SUBMIT</button>
    <button id="reset">RESET</button>

    <div id="output">
        <h3>PARAMETERS</h3>

        <span>g: </span>
        <span id="g"></span><br>

        <span>b: </span>
        <span id="b"></span><br>
        
        <span>B1: </span>
        <span id="B1"></span><br>

        <span>B2: </span>
        <span id="B2"></span>
    </div>
</body>
<script src="script.js"></script>
</html>
